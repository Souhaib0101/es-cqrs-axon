spring.application.name=demo-es-cqrs-axon
server.port=${PORT:8080}

# Local mode persists both the event log and the separate projection tables.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/accounts;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

axon.axonserver.enabled=false
axon.serializer.general=jackson
axon.serializer.events=jackson
axon.serializer.messages=jackson
axon.eventhandling.processors.accounts.mode=tracking
