spring.application.name=demo-es-cqrs-axon
server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:mem:accounts;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# The connector is excluded by default so the application runs with Axon's in-memory event store.
# Enable the Axon Server dependency and set axon.axonserver.enabled=true to use a shared event store.
axon.axonserver.enabled=${AXON_SERVER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
