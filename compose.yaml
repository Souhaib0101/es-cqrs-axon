services:
  axon-server:
    image: axoniq/axonserver:2024.1.4
    environment:
      AXONIQ_AXONSERVER_STANDALONE: "true"
    ports:
      - "127.0.0.1:8024:8024"
      - "127.0.0.1:8124:8124"
    volumes:
      - axon-data:/axonserver/data
      - axon-events:/axonserver/events
      - axon-config:/axonserver/config

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: ${DB_PASSWORD:-accounts}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounts -d accounts"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  axon-data:
  axon-events:
  axon-config:
  postgres-data:
